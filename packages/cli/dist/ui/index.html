  <style>
#ali-quota-card{position:fixed;right:14px;bottom:14px;z-index:99999;background:rgba(15,16,24,.93);color:#e4e4e7;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:10px 14px;font:12px/1.5 ui-monospace,Menlo,monospace;box-shadow:0 6px 24px rgba(0,0,0,.45);min-width:250px;backdrop-filter:blur(8px)}
#aqp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
#aqp-ttl{font-weight:700;letter-spacing:.6px}
#ali-quota-card.ok #aqp-ttl{color:#34d399}
#ali-quota-card.warn #aqp-ttl{color:#fbbf24}
#ali-quota-card.blocked{border-color:#f87171;background:rgba(50,8,8,.96)}
#ali-quota-card.blocked #aqp-ttl{color:#f87171}
#aqp-breaker{border:1px solid rgba(255,255,255,.28);border-radius:10px;width:36px;height:20px;background:rgba(255,255,255,.14);position:relative;cursor:pointer;padding:0;transition:background .2s;flex:0 0 auto}
#aqp-breaker::after{content:"";position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:#e4e4e7;transition:transform .2s}
#ali-quota-card.breaker-on #aqp-breaker{background:#10b981;border-color:#10b981}
#ali-quota-card.breaker-on #aqp-breaker::after{transform:translateX(16px);background:#fff}
#aqp-bar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;margin:6px 0 4px;overflow:hidden}
#aqp-bar>span{display:block;height:100%;transition:width .5s,background .5s}
#aqp-sub{opacity:.85;font-size:11px}
</style>
<div id="ali-quota-card"><div id="aqp-head"><span id="aqp-ttl">ALI 当日配额</span><button id="aqp-breaker" title="熔断开关"></button></div><div id="aqp-body">加载中…</div></div>
<script>
(function(){
  var card=document.getElementById('ali-quota-card'),body=document.getElementById('aqp-body'),btn=document.getElementById('aqp-breaker');
  function fmt(n){return (n||0).toLocaleString();}
  function render(d){
    var pct=d.percent||0,blk=d.blocked,brk=d.breaker;
    card.className=(blk?'blocked':(pct>=70?'warn':'ok'))+(brk?' breaker-on':'');
    btn.title=brk?'熔断已启用·点击关闭(超额将不拦)':'熔断已关闭·点击启用(超额将拦)';
    var col=blk?'#f87171':(pct>=70?'#fbbf24':'#34d399');
    body.innerHTML='<div>'+fmt(d.used)+' / '+fmt(d.limit)+' token</div>'+
      '<div id="aqp-bar"><span style="width:'+Math.min(100,pct)+'%;background:'+col+'"></span></div>'+
      '<div id="aqp-sub">'+pct.toFixed(2)+'% · 剩余 '+fmt(d.remaining)+(d.requests?' · '+d.requests+' 请求':'')+' · '+(blk?'已熔断·模型不可用':(brk?'正常':'熔断关闭·超额不拦'))+'</div>';
  }
  function tick(){fetch('/api/quota',{cache:'no-store'}).then(function(r){return r.json();}).then(render).catch(function(){body.textContent='查询失败';});}
  btn.addEventListener('click',function(){btn.disabled=true;fetch('/api/quota/breaker/toggle',{method:'POST'}).then(function(){tick();}).finally(function(){btn.disabled=false;});});
  tick();setInterval(tick,10000);
})();
</script>
  </body>
</html>
